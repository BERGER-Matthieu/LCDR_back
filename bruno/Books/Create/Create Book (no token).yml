info:
  name: Create Book (no token)
  type: http
  seq: 1

http:
  method: POST
  url: "{{Url}}/books/"
  body:
    type: json
    data: |-
      {
        "name": "{{bookName}}",
        "description": "{{bookDescription}}",
        "communityId": "{{communityId}}"
      }
  auth: inherit

