info:
  name: Create Community
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url}}/communities/"
  headers:
    - name: Authorization
      value: "{{jwt}}"
  body:
    type: json
    data: |-
      {
        "name": "{{communityName}}",
        "description": "{{communityDescription}}"
      }
  auth: inherit

runtime:
