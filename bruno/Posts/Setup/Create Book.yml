info:
  name: Create Book
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url}}/books/"
  headers:
    - name: Authorization
      value: "{{jwt}}"
  body:
    type: json
    data: |-
      {
        "name": "{{bookName}}",
        "description": "{{bookDescription}}",
        "communityId": "{{communityId}}"
      }
  auth: inherit

runtime:
  scripts:
