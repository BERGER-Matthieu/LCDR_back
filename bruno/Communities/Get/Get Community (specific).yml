http:
  method: GET
  url: "{{Url}}/communities/?id={{communityId}}"
  params:
    - name: id
      value: "{{communityId}}"
      type: query
    - name: skip
      value: "2"
      type: query
      disabled: true
    - name: limit
      value: "100"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should get new community", () => {
          expect(res.getStatus()).to.equal(200);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
