info:
  name: Get User (specific)
  type: http
  seq: 1

http:
  method: GET
  url: "{{Url}}/users/?name={{userName}}"
  params:
    - name: name
      value: "{{userName}}"
      type: query
    - name: skip
      value: "10"
      type: query
      disabled: true
    - name: limit
      value: "100"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should get new user", () => {
          const data = res.getBody();
          expect(res.getStatus()).to.equal(200);
          bru.setEnvVar("userId", data.id)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
