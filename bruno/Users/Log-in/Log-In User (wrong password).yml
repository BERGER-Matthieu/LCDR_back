info:
  name: Log-In User (wrong password)
  type: http
  seq: 1

http:
  method: GET
  url: "{{Url}}/users/login?email={{userEmail}}&password=wrong_password"
  params:
    - name: email
      value: "{{userEmail}}"
      type: query
    - name: password
      value: wrong_password
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("should NOT log-in user", () => {
          expect(res.getStatus()).to.equal(401);
        })
    - type: tests
      code: |-
        test("should NOT login user", () => {
          expect(res.getStatus()).to.equal(401);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
