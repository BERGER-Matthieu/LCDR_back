info:
  name: Create Post
  type: http
  seq: 4

http:
  method: POST
  url: "{{Url}}/posts/"
  headers:
    - name: Authorization
      value: "{{jwt}}"
  body:
    type: json
    data: |-
      {
        "content": "{{postContent}}",
        "bookId": "{{bookId}}"
      }
  auth: inherit

