http:
  method: POST
  url: "{{Url}}/comments/"
  headers:
    - name: Authorization
      value: "{{jwt}}"
  body:
    type: json
    data: |-
      {
        "content": "{{commentContent}}",
        "postId": "{{postId}}"
      }
  auth: inherit

