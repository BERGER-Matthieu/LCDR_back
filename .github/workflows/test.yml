name: Test

on:
  push:
    branches: dev

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/LCDR_test
      PORT: 3000
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js (for Bruno CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: bun install

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Start server in background
        run: |
          bun run src/index.ts > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s "http://localhost:${PORT}/api" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within timeout"
          cat server.log
          exit 1

      - name: Run Bruno tests
        working-directory: ./bruno
        run: bru run --env LCDR -r

      - name: Show server logs
        if: always()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
