name: Run Bruno Tests

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/LCDR_db
      PORT: 3000
      JWT_SECRET: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Work around Bun/bson v8.startupSnapshot bug
        run: |
          cat > src/patch.ts <<'EOF'
          if (globalThis.process?.getBuiltinModule) {
            try {
              const v8 = globalThis.process.getBuiltinModule('v8')
              if (v8) {
                Object.defineProperty(v8, 'startupSnapshot', {
                  value: { isBuildingSnapshot: () => false },
                  configurable: true,
                  writable: true,
                })
              }
            } catch {}
          }
          EOF
          cat > bunfig.toml <<'EOF'
          [run]
          preload = ["./src/patch.ts"]
          EOF

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Start Elysia server
        run: |
          bun run src/index.ts &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000

      - name: Run Bruno tests
        working-directory: bruno
        run: bru run --env LCDR --recursive

      - name: Stop Elysia server
        if: always()
        run: kill $SERVER_PID
