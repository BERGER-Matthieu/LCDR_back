name: Run Bruno Tests

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/LCDR_db
      PORT: 3000
      JWT_SECRET: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Create empty LCDR-DB collection
        run: docker run --rm --network host mongo:7 mongosh "$MONGO_URI" --eval 'db.createCollection("LCDR_db")'

      - name: Checkout Bruno tests
        uses: actions/checkout@v4
        with:
          repository: BERGER-Matthieu/LCDR_bruno
          path: bruno-tests
          # token: ${{ secrets.BRUNO_REPO_PAT }}  # uncomment if LCDR_bruno is private

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Start Elysia server
        run: bun run src/index.ts &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000

      - name: Run Bruno tests
        working-directory: bruno-tests
        run: bru run --recursive
